[package]
name = "storage-scanner"
version = "0.1.0"
edition = "2021"
description = "システムのストレージをスキャンし、巨大で不要なディレクトリを検出するツール"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Seduce0068/KubuntuStrageCleanRustscript"
readme = "README.md"

[dependencies]
# 外部依存はディレクトリ再帰走査用の walkdir のみ
# それ以外の処理は標準ライブラリで構成
walkdir = "2.5"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
